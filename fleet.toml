schema_version = 2
fleet_name = "mcp-local-dev"

[policy]
update_mode = "manual"
require_clean_tree = true
require_fast_forward = true
build_profile = "release"

[components.filesystem]
kind = "git"
source_dir = "filesystem"
repository = "https://github.com/13thx-mcp/filesystem.git"
package = "rust-mcp-filesystem"
build_output = "target/release/rust-mcp-filesystem"
binary = "rust-mcp-filesystem"
required = true
build = ["cargo", "build", "--release", "--locked"]
test = ["cargo", "test", "--all-targets", "--all-features"]

[components.git]
kind = "git"
source_dir = "git"
repository = "https://github.com/13thx-mcp/git.git"
package = "rust-mcp-git"
build_output = "target/release/rust-mcp-git"
binary = "rust-mcp-git"
required = true
build = ["cargo", "build", "--release", "--locked"]
test = ["cargo", "test", "--all-targets", "--all-features"]

[components.exec]
kind = "git"
source_dir = "exec"
repository = "https://github.com/13thx-mcp/exec.git"
package = "rust-mcp-exec"
build_output = "target/release/rust-mcp-exec"
binary = "rust-mcp-exec"
required = true
build = ["cargo", "build", "--release", "--locked"]
test = ["cargo", "test", "--all-targets", "--all-features"]

[components.gateway]
kind = "git"
source_dir = "gateway"
repository = "https://github.com/13thx-mcp/gateway.git"
package = "rust-mcp-gateway"
build_output = "target/release/rust-mcp-gateway"
binary = "rust-mcp-gateway"
required = true
build = ["cargo", "build", "--release", "--locked"]
test = ["cargo", "test", "--all-targets", "--all-features"]

[components.studio]
kind = "git"
source_dir = "studio"
repository = "https://github.com/13thx-mcp/studio.git"
package = "mcp-studio"
build_output = "target/release/mcp-studio"
binary = "mcp-studio"
required = true
build = ["cargo", "build", "--release", "--locked"]
test = ["cargo", "test", "--all-targets", "--all-features"]

[components.tunnel-client]
kind = "upstream_release"
repository = "https://github.com/openai/tunnel-client"
release_api = "https://api.github.com/repos/openai/tunnel-client/releases/latest"
asset_prefix = "tunnel-client-runtime-cloudflared"
install_dir = "tunnel-client"
binary = "tunnel-client-runtime-cloudflared"
manifest = "cloudflared-manifest.json"
local_config = "config.yaml"
required = true
