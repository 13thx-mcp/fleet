name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-package-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Validate version and tests
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          version="${tag#v}"
          test "$tag" = "v$version"
          test "$version" = "$(tr -d '[:space:]' < VERSION)" || { echo "tag $tag != VERSION $(cat VERSION)" >&2; exit 1; }
          python3 -m py_compile scripts/fleetctl.py
          python3 -m unittest discover -s tests -v
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package fleet control bundle
        shell: bash
        run: |
          set -euo pipefail
          name="mcp-fleet-v${{ steps.meta.outputs.version }}"
          mkdir -p "dist/$name/hosts" "dist/$name/scripts"
          cp VERSION fleet.toml README.md "dist/$name/"
          cp scripts/fleetctl.py "dist/$name/scripts/"
          cp hosts/mirin.example.toml "dist/$name/hosts/"
          chmod 0755 "dist/$name/scripts/fleetctl.py"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          repo="${{ github.repository }}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS.txt --repo "$repo" --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS.txt --repo "$repo" --title "$tag" --generate-notes --verify-tag
          fi
