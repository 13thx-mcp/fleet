schema_version = 1
host_id = "aira"
workspace_root = "/Users/xiivth/workspaces/signs"
source_root = "/Users/xiivth/workspaces/signs/mcp-server/src"
runtime_root = "/Users/xiivth/workspaces/signs/mcp-server/bin"

[gateway]
server_dir = "../../bin/gateway/servers.d"

[servers.filesystem]
enabled = true
timeout_ms = 30000
tool_allowlist = []

[servers.git]
enabled = true
timeout_ms = 30000
extra_args = ["--allow-remote-read"]
tool_allowlist = [
  "git_list_repositories", "git_status", "git_diff", "git_log", "git_show",
  "git_branches", "git_history_plan", "git_validate_merge_readiness",
  "git_dev_control_readiness", "git_amend_commit", "git_create_branch",
  "git_switch", "git_merge", "git_delete_branch", "git_stage", "git_unstage",
  "git_restore", "git_commit", "git_tag", "git_reword_commits",
  "git_squash_commits", "git_verify_unpublished", "git_rewind_merge",
  "git_replace_local_tag", "git_release_tag", "git_fetch", "git_pull", "git_push"
]

[servers.exec]
enabled = true
timeout_ms = 600000
extra_args = [
  "--default-timeout-ms", "120000",
  "--max-timeout-ms", "300000",
  "--max-output-bytes", "2097152"
]
tool_allowlist = ["workspace_execute", "workspace_detect_project", "workspace_quality_check"]

[servers.exec.env]
CI = "1"
