schema_version = 2
host_id = "aira"
workspace_root = "/Users/xiivth/workspaces/signs"
source_root = "/Users/xiivth/workspaces/signs/mcp-server"
bin_root = "/Users/xiivth/workspaces/signs/mcp-server/bin"
runtime_root = "/Users/xiivth/workspaces/signs/mcp-server/runtime"

[tunnel]
tunnel_id = "tunnel_6aaa078723508191a0a0e9a43f68e84e"
control_plane_api_key_file = "/Users/xiivth/workspaces/signs/mcp-server/runtime/tunnel-client/credentials/control-plane-api-key"

[gateway]
server_dir = "gateway/servers.d"
policy_file = "gateway/gateway.yaml"

[gateway.policy]
active_profile = "develop"
global_active = 16
global_queue = 64
queue_wait_ms = 30000
default_child_active = 4
drain_deadline_ms = 60000
allow_safe_reads = false
profiles = ["inspect", "develop", "release", "ops", "hardware"]

[servers.filesystem]
enabled = true
timeout_ms = 30000
tool_allowlist = []

[servers.git]
enabled = true
timeout_ms = 30000
extra_args = ["--allow-remote-read"]
tool_allowlist = [
  "git_list_repositories", "git_status", "git_diff", "git_log", "git_show",
  "git_branches", "git_history_plan", "git_validate_merge_readiness",
  "git_dev_control_readiness", "git_amend_commit", "git_create_branch",
  "git_switch", "git_merge", "git_delete_branch", "git_stage", "git_unstage",
  "git_restore", "git_commit", "git_tag", "git_reword_commits",
  "git_squash_commits", "git_verify_unpublished", "git_rewind_merge",
  "git_replace_local_tag", "git_release_tag", "git_fetch", "git_pull", "git_push"
]

[servers.exec]
enabled = true
timeout_ms = 600000
extra_args = [
  "--default-timeout-ms", "120000",
  "--max-timeout-ms", "300000",
  "--max-output-bytes", "2097152"
]
tool_allowlist = ["workspace_execute", "workspace_detect_project", "workspace_quality_check"]

[servers.exec.env]
CI = "1"
